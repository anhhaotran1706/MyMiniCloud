events {}
http {
  # [P2-10] Nhóm 2 web server, mặc định Round Robin
  upstream web_cluster {
    server web-frontend-server1:80;
    server web-frontend-server2:80;
  }

  server {
    listen 80;

    # Web tĩnh
    location / {
      proxy_pass http://web-frontend-server:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App API (strip /api/)
    location /api/ {
      proxy_pass http://application-backend-server:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak
    location /auth/ {
      proxy_pass http://authentication-identity-server:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [P2-9] Route /student/ trỏ tới API /student của backend
    location /student/ {
      proxy_pass http://application-backend-server:8081/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [P2-10] Load balancer Round Robin giữa web-frontend-server1 và web-frontend-server2
    location /lb/ {
      proxy_pass http://web_cluster/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Upstream $upstream_addr always;
      add_header Cache-Control "no-store" always;
    }
  }
}
